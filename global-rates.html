<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>GLOBAL RATES</title>

<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>
:root{
  --bg:#f3f5f9;
  --surface:#ffffff;
  --surface-2:#f8fafc;
  --surface-3:#eef2f7;
  --border:#d9e2ee;
  --text:#0f172a;
  --muted:#64748b;
  --primary:#0f172a;
  --success:#0f9d6a;
  --success-bg:#ecfdf5;
  --success-border:#bbf7d0;
  --danger:#dc2626;
  --danger-bg:#fef2f2;
  --danger-border:#fecaca;
  --warning:#b45309;
  --warning-bg:#fff7ed;
  --warning-border:#fed7aa;
  --shadow-sm:0 6px 18px rgba(15,23,42,.05);
  --shadow-md:0 14px 36px rgba(15,23,42,.08);
  --radius:20px;
  --radius-md:14px;
  --radius-sm:10px;
  --font-scale:.92;
  --page-pad:clamp(10px,1.4vw,22px);
  --header-pad-y:10px;
  --mobile-font-scale:.76;
}

*{box-sizing:border-box}
html{
  -webkit-text-size-adjust:100%;
  scroll-behavior:smooth;
}
body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:"Satoshi",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:calc(16px * var(--font-scale));
  line-height:1.42;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button,input,select,textarea{-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}
.tabular{font-variant-numeric:tabular-nums lining-nums}

mark.hl{
  background:#fff1a8;
  color:#111827;
  padding:0 .14em;
  border-radius:4px;
  box-shadow:inset 0 -1px 0 rgba(180,83,9,.18);
  font-weight:900;
}

#app{
  min-height:100dvh;
  width:100%;
}

.topbar{
  position:sticky;
  top:0;
  z-index:60;
  width:100%;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding:var(--header-pad-y) var(--page-pad);
  transition:padding .3s ease, box-shadow .3s ease;
}
.topbar.expanded,
.topbar.intro-complete{
  box-shadow:0 10px 30px rgba(15,23,42,.05);
}

.topbar-shell{
  display:grid;
  grid-template-columns:1fr auto;
  align-items:center;
  gap:10px;
  min-height:42px;
}

.brand-cluster{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
  overflow:hidden;
  opacity:1;
  max-width:480px;
  transform:translateX(0);
  transition:
    opacity .5s ease,
    transform .55s ease,
    max-width .55s ease,
    margin .55s ease;
}

.topbar.intro-complete .brand-cluster{
  opacity:0;
  transform:translateX(-16px);
  max-width:0;
  margin-right:0;
  pointer-events:none;
}

.brand-wrap{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.brand-mark{
  width:38px;
  height:38px;
  border-radius:11px;
  display:grid;
  place-items:center;
  background:linear-gradient(180deg,#172033,#0f172a);
  color:#fff;
  font-weight:900;
  letter-spacing:.06em;
  box-shadow:var(--shadow-sm);
  flex:0 0 auto;
  font-size:calc(13px * var(--font-scale));
}

.brand-title{
  font-size:calc(17px * var(--font-scale));
  font-weight:900;
  letter-spacing:.04em;
  text-transform:uppercase;
  line-height:1.1;
}

.brand-sub{
  color:var(--muted);
  font-size:calc(11px * var(--font-scale));
  margin-top:2px;
  text-transform:uppercase;
  letter-spacing:.06em;
  line-height:1.2;
}

.header-chip{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:34px;
  padding:0 11px;
  border-radius:999px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--muted);
  font-size:calc(11px * var(--font-scale));
  font-weight:700;
  white-space:nowrap;
  transition:opacity .5s ease, transform .5s ease;
}

.search-stage{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:8px;
  min-width:0;
}

.nav-toggle{
  position:relative;
  width:42px;
  height:42px;
  border:none;
  border-radius:999px;
  background:var(--primary);
  color:#fff;
  box-shadow:var(--shadow-sm);
  display:grid;
  place-items:center;
  transition:transform .28s ease, box-shadow .28s ease, background .28s ease;
  flex:0 0 auto;
}
.nav-toggle:hover{transform:translateY(-1px)}
.nav-toggle:active{transform:scale(.96)}
.nav-toggle.has-query::after{
  content:"";
  position:absolute;
  top:5px;
  right:5px;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#22c55e;
  border:2px solid #fff;
}
.nav-toggle .icon-wrap{
  position:relative;
  width:18px;
  height:18px;
}
.nav-toggle i{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  font-size:18px;
  transition:transform .28s ease, opacity .22s ease;
}
.nav-toggle .icon-search{
  opacity:1;
  transform:rotate(0deg) scale(1);
}
.nav-toggle .icon-close{
  opacity:0;
  transform:rotate(-90deg) scale(.6);
}
.topbar.expanded .nav-toggle .icon-search,
.topbar.intro-complete.search-open .nav-toggle .icon-search{
  opacity:0;
  transform:rotate(90deg) scale(.6);
}
.topbar.expanded .nav-toggle .icon-close,
.topbar.intro-complete.search-open .nav-toggle .icon-close{
  opacity:1;
  transform:rotate(0deg) scale(1);
}

.inline-search-shell{
  min-width:0;
  flex:1 1 auto;
  display:flex;
  justify-content:flex-end;
}

.inline-search{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
  width:min(720px,100%);
  max-width:56px;
  opacity:0;
  transform:translateX(8px);
  pointer-events:none;
  transition:
    max-width .48s cubic-bezier(.2,.8,.2,1),
    opacity .32s ease,
    transform .42s ease;
}

.topbar.intro-complete .inline-search,
.topbar.expanded .inline-search{
  max-width:720px;
  opacity:1;
  transform:translateX(0);
  pointer-events:auto;
}

.search-wrap{
  position:relative;
  flex:1 1 auto;
  min-width:0;
}

.search-wrap i.bi-search{
  position:absolute;
  left:12px;
  top:50%;
  transform:translateY(-50%);
  color:var(--muted);
  font-size:calc(13px * var(--font-scale));
  pointer-events:none;
}

.search-wrap input{
  width:100%;
  min-height:40px;
  border-radius:12px;
  border:1px solid var(--border);
  background:#fff;
  outline:none;
  padding:9px 38px 9px 34px;
  color:var(--text);
  font-size:calc(13px * var(--font-scale));
  box-shadow:0 1px 0 rgba(15,23,42,.02);
}
.search-wrap input:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(15,23,42,.08);
}
.clear-search{
  position:absolute;
  right:7px;
  top:50%;
  transform:translateY(-50%);
  width:26px;
  height:26px;
  border-radius:999px;
  border:none;
  background:#eef2f7;
  color:var(--muted);
  display:none;
  place-items:center;
}
.clear-search.show{display:grid}

.tabs{
  display:flex;
  gap:8px;
  flex-wrap:nowrap;
}
.tabs button{
  min-height:40px;
  padding:0 14px;
  border-radius:12px;
  border:1px solid var(--border);
  background:#fff;
  color:var(--text);
  font-size:calc(12px * var(--font-scale));
  font-weight:800;
  letter-spacing:.02em;
  white-space:nowrap;
}
.tabs button.active{
  background:var(--primary);
  border-color:var(--primary);
  color:#fff;
}

.page{
  width:100%;
  max-width:none;
  margin:0;
  padding:var(--page-pad);
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
  margin-bottom:16px;
}

.stat{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  padding:12px;
  box-shadow:var(--shadow-sm);
}

.stat .k{
  color:var(--muted);
  font-size:calc(10px * var(--font-scale));
  font-weight:800;
  letter-spacing:.07em;
  text-transform:uppercase;
}

.stat .v{
  margin-top:5px;
  font-size:calc(23px * var(--font-scale));
  line-height:1;
  font-weight:900;
}

.stat .green{color:var(--success)}
.stat .red{color:var(--danger)}

.section-head{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:10px;
}

.section-title{
  font-size:calc(15px * var(--font-scale));
  font-weight:900;
  letter-spacing:.02em;
}

.section-sub{
  color:var(--muted);
  font-size:calc(11px * var(--font-scale));
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.06em;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));
  gap:12px;
  width:100%;
}

.rate-card{
  display:flex;
  flex-direction:column;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
  box-shadow:var(--shadow-sm);
  content-visibility:auto;
  min-width:0;
}

.card-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:8px;
  padding:12px 12px 8px;
  background:linear-gradient(180deg,#ffffff,#fbfcff);
  border-bottom:1px solid var(--border);
}

.route-main{
  font-size:calc(14px * var(--font-scale));
  font-weight:900;
  line-height:1.28;
  letter-spacing:.01em;
  word-break:break-word;
}

.route-sub{
  margin-top:4px;
  color:var(--muted);
  font-size:calc(11px * var(--font-scale));
  line-height:1.35;
  display:-webkit-box;
  -webkit-line-clamp:1;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.badges{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  justify-content:flex-end;
  max-width:44%;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:4px 8px;
  border-radius:999px;
  border:1px solid var(--border);
  background:#fff;
  white-space:nowrap;
  font-size:calc(10px * var(--font-scale));
  font-weight:800;
  letter-spacing:.03em;
  text-transform:uppercase;
}
.badge.success{color:var(--success); background:var(--success-bg); border-color:var(--success-border)}
.badge.danger{color:var(--danger); background:var(--danger-bg); border-color:var(--danger-border)}
.badge.warning{color:var(--warning); background:var(--warning-bg); border-color:var(--warning-border)}

.card-body{
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.rate-strip{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
}

.rate-box{
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--surface-2);
  padding:10px;
}

.rate-box .rk{
  color:var(--muted);
  font-size:calc(10px * var(--font-scale));
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.05em;
}

.rate-box .rv{
  margin-top:4px;
  font-size:calc(19px * var(--font-scale));
  line-height:1.02;
  font-weight:900;
  letter-spacing:-.02em;
  word-break:break-word;
}

.rate-box .rt{
  margin-top:5px;
  color:var(--muted);
  font-size:calc(10px * var(--font-scale));
  font-weight:700;
}

.quick-meta{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:7px;
}

.mini-meta{
  border:1px solid var(--border);
  border-radius:11px;
  background:#fff;
  padding:9px;
}

.mini-meta .mk{
  color:var(--muted);
  font-size:calc(9px * var(--font-scale));
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.06em;
  margin-bottom:3px;
}

.mini-meta .mv{
  font-size:calc(11px * var(--font-scale));
  font-weight:800;
  word-break:break-word;
  line-height:1.25;
}

.desktop-extra{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:7px;
}

.remarks-preview{
  border:1px solid var(--border);
  background:#fff;
  border-radius:11px;
  padding:9px;
  font-size:calc(11px * var(--font-scale));
  color:var(--text);
}
.remarks-preview .rk{
  color:var(--muted);
  font-size:calc(9px * var(--font-scale));
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.06em;
  margin-bottom:3px;
}
.remarks-preview .rv{
  color:var(--text);
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  line-height:1.3;
}

.card-foot{
  margin-top:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:10px 12px 12px;
  border-top:1px solid var(--border);
  background:#fcfdff;
}

.foot-left{
  min-width:0;
}

.seq{
  color:var(--muted);
  font-size:calc(10px * var(--font-scale));
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.06em;
}

.validity{
  margin-top:3px;
  font-size:calc(11px * var(--font-scale));
  font-weight:900;
}
.validity.green{color:var(--success)}
.validity.red{color:var(--danger)}

.action-row{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.btn{
  min-height:34px;
  padding:0 12px;
  border-radius:10px;
  border:1px solid var(--border);
  background:#fff;
  color:var(--text);
  font-size:calc(12px * var(--font-scale));
  font-weight:800;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
}
.btn.primary{
  background:var(--primary);
  border-color:var(--primary);
  color:#fff;
}
.btn.ghost{
  background:#fff;
}

.empty{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:18px;
  padding:28px 18px;
  text-align:center;
  color:var(--muted);
  box-shadow:var(--shadow-sm);
  width:100%;
}

.tc-box{
  margin-top:16px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:18px;
  padding:14px;
  box-shadow:var(--shadow-sm);
  width:100%;
}
.tc-title{
  font-size:calc(14px * var(--font-scale));
  font-weight:900;
  margin-bottom:8px;
}
.tc-text{
  color:var(--muted);
  font-size:calc(11px * var(--font-scale));
  line-height:1.65;
  white-space:pre-wrap;
}

.loader{
  position:fixed;
  inset:0;
  z-index:1000;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(15,23,42,.18);
  backdrop-filter:blur(4px);
}
.loader.show{display:flex}
.loader-box{
  min-width:220px;
  padding:16px;
  border-radius:16px;
  border:1px solid var(--border);
  background:#fff;
  text-align:center;
  box-shadow:var(--shadow-md);
}
.spinner{
  width:34px;
  height:34px;
  margin:0 auto 9px;
  border-radius:50%;
  border:3px solid rgba(15,23,42,.12);
  border-top-color:var(--primary);
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.overlay{
  position:fixed;
  inset:0;
  z-index:1200;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:14px;
  background:rgba(15,23,42,.24);
  backdrop-filter:blur(5px);
}

.modal{
  width:min(900px,100%);
  max-height:92vh;
  overflow:auto;
  background:#fff;
  border:1px solid var(--border);
  border-radius:20px;
  box-shadow:var(--shadow-md);
  padding:14px;
}

.modal-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
  margin-bottom:10px;
}

.modal-title{
  font-size:calc(16px * var(--font-scale));
  font-weight:900;
  line-height:1.3;
}

.modal-sub{
  margin-top:4px;
  color:var(--muted);
  font-size:calc(11px * var(--font-scale));
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.06em;
}

.icon-btn{
  width:36px;
  height:36px;
  flex:0 0 auto;
  border-radius:10px;
  border:1px solid var(--border);
  background:#fff;
  color:var(--text);
  display:grid;
  place-items:center;
}

.modal-rates{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
  margin-bottom:10px;
}

.modal-meta{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
}

.meta-item{
  border:1px solid var(--border);
  border-radius:11px;
  padding:9px;
  background:#fff;
}
.meta-item .mk{
  color:var(--muted);
  font-size:calc(9px * var(--font-scale));
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.06em;
  margin-bottom:3px;
}
.meta-item .mv{
  font-size:calc(12px * var(--font-scale));
  font-weight:800;
  word-break:break-word;
  line-height:1.3;
}

.modal-remarks,
.modal-terms{
  margin-top:10px;
  border:1px solid var(--border);
  border-radius:11px;
  background:#fff;
  padding:9px;
  font-size:calc(12px * var(--font-scale));
  line-height:1.55;
}
.modal-remarks .rk,
.modal-terms .rk{
  color:var(--muted);
  font-size:calc(9px * var(--font-scale));
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.06em;
  margin-bottom:3px;
}

.modal-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px;
}

.copy-toast{
  position:fixed;
  right:14px;
  bottom:14px;
  z-index:1300;
  background:var(--primary);
  color:#fff;
  border-radius:11px;
  padding:9px 11px;
  font-size:calc(12px * var(--font-scale));
  font-weight:800;
  box-shadow:var(--shadow-md);
}

.desktop-copy{
  display:inline-flex;
}

@media (max-width:1100px){
  .header-chip{
    display:none;
  }
  .desktop-extra{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}

@media (max-width:900px){
  .stats{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}

@media (max-width:760px){
  :root{
    --font-scale:var(--mobile-font-scale);
    --page-pad:10px;
    --header-pad-y:8px;
  }

  body{
    line-height:1.34;
  }

  .brand-mark{
    width:34px;
    height:34px;
    border-radius:10px;
  }

  .brand-title{
    font-size:13px;
  }

  .brand-sub{
    font-size:9px;
  }

  .nav-toggle{
    width:38px;
    height:38px;
  }

  .inline-search{
    width:100%;
  }

  .tabs{
    display:none;
  }

  .topbar.expanded .tabs,
  .topbar.intro-complete .tabs{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    width:100%;
  }

  .topbar.expanded .inline-search,
  .topbar.intro-complete .inline-search{
    flex-wrap:wrap;
  }

  .search-stage{
    width:auto;
    flex:1 1 auto;
  }

  .search-wrap input{
    min-height:36px;
    padding:8px 34px 8px 31px;
    border-radius:11px;
  }

  .tabs button{
    min-height:36px;
    padding:0 8px;
    border-radius:10px;
  }

  .stats{
    gap:8px;
    margin-bottom:12px;
  }

  .stat{
    padding:9px;
    border-radius:14px;
  }

  .stat .v{
    font-size:18px;
  }

  .section-head{
    margin-bottom:8px;
  }

  .section-sub{
    display:none;
  }

  .grid{
    grid-template-columns:1fr;
    gap:8px;
  }

</head>
<body>
<div id="app">
  <div id="loader" class="loader" aria-live="polite" aria-hidden="true">
    <div class="loader-box">
      <div class="spinner"></div>
      <div style="font-size:calc(14px * var(--font-scale));font-weight:900;">LOADING RATES...</div>
      <div style="font-size:calc(11px * var(--font-scale));color:var(--muted);margin-top:4px;">PLEASE WAIT</div>
    </div>
  </div>

  <header class="topbar" id="topbar">
    <div class="topbar-shell">
      <div class="brand-cluster" id="brandCluster">
        <div class="brand-wrap">
          <div class="brand-mark">GR</div>
          <div>
            <div class="brand-title">Global Rates</div>
            <div class="brand-sub">Live FCL Rate Showcase</div>
          </div>
        </div>

        <div class="header-chip">
          <i class="bi bi-shield-check"></i>
          <span>Final Freight Only</span>
        </div>
      </div>

      <div class="search-stage">
        <div class="inline-search-shell">
          <div class="inline-search">
            <div class="search-wrap">
              <i class="bi bi-search"></i>
              <input id="searchInput" type="text" placeholder="Search: Mundra Jeddah, Nhava Dubai, Jebel 40HC..." />
              <button class="clear-search" id="clearSearch" aria-label="Clear search">
                <i class="bi bi-x"></i>
              </button>
            </div>

            <div class="tabs">
              <button class="active" data-view="active" id="tabActive">ACTIVE</button>
              <button data-view="expired" id="tabExpired">EXPIRED</button>
              <button data-view="all" id="tabAll">ALL</button>
            </div>
          </div>
        </div>

        <button id="navToggle" class="nav-toggle" aria-label="Open search and filters" aria-expanded="false">
          <span class="icon-wrap">
            <i class="bi bi-search icon-search"></i>
            <i class="bi bi-x-lg icon-close"></i>
          </span>
        </button>
      </div>
    </div>
  </header>

  <main class="page">
    <section class="stats">
      <div class="stat">
        <div class="k">Total Rates</div>
        <div class="v tabular" id="statTotal">0</div>
      </div>
      <div class="stat">
        <div class="k">Active Rates</div>
        <div class="v green tabular" id="statActive">0</div>
      </div>
      <div class="stat">
        <div class="k">Expired Rates</div>
        <div class="v red tabular" id="statExpired">0</div>
      </div>
      <div class="stat">
        <div class="k">Visible Now</div>
        <div class="v tabular" id="statVisible">0</div>
      </div>
    </section>

    <section>
      <div class="section-head">
        <div class="section-title" id="sectionTitle">ACTIVE RATES</div>
        <div class="section-sub">Auto-hide intro → search bar transition</div>
      </div>

      <div class="grid" id="ratesGrid"></div>
    </section>

    <section class="tc-box">
      <div class="tc-title">Terms & Conditions</div>
      <div class="tc-text" id="termsTextBox"></div>
    </section>
  </main>

  <div id="rateModal" class="overlay hidden" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <div>
          <div class="modal-title" id="modalTitle">RATE DETAIL</div>
          <div class="modal-sub" id="modalSub">FULL DETAILS</div>
        </div>
        <button class="icon-btn" id="closeModal" aria-label="Close details">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>

      <div class="modal-rates" id="modalRates"></div>
      <div class="modal-meta" id="modalMeta"></div>
      <div class="modal-remarks" id="modalRemarks"></div>
      <div class="modal-terms" id="modalTerms"></div>

      <div class="modal-actions">
        <button class="btn primary" id="copyModalBtn">
          <i class="bi bi-clipboard"></i>
          <span>Copy Rate</span>
        </button>
        <button class="btn ghost" id="closeModalBtn2">
          <i class="bi bi-x-circle"></i>
          <span>Close</span>
        </button>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const app = initializeApp({ projectId: "swifty-52e05" });
const db = getFirestore(app);
const $ = (id) => document.getElementById(id);

const TERMS_TEXT = `1. Rates are subject to space and equipment availability at the time of booking.
2. Validity is as mentioned against each offer unless withdrawn earlier.
3. Routing, transit time, and sailing details are indicative and subject to line schedule.
4. Detention, demurrage, customs examination, storage, insurance, and destination charges are excluded unless stated otherwise.
5. All bookings remain subject to final confirmation.`;

const SLABS = [
  { min: 0, max: 50, add: 50 },
  { min: 50, max: 250, add: 75 },
  { min: 250, max: 740, add: 97 },
  { min: 740, max: 1000, add: 108 },
  { min: 1000, max: 1500, add: 125 },
  { min: 1500, max: 2000, add: 150 },
  { min: 2000, max: 3000, add: 175 },
  { min: 3000, max: 4500, add: 225 },
  { min: 4500, max: 6000, add: 300 },
  { min: 6000, max: Infinity, add: 350 }
];

let data = [];
let currentView = "active";
let currentModalRate = null;
let navOpen = false;
let introDone = false;
let introTimer = null;

$("termsTextBox").textContent = TERMS_TEXT;

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

function escapeRegExp(str){
  return String(str).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

function showLoader(){ $("loader").classList.add("show"); }
function hideLoader(){ $("loader").classList.remove("show"); }

function num(v){
  const n = parseFloat(String(v ?? "").replace(/,/g,"").trim());
  return Number.isNaN(n) ? 0 : n;
}

function formatUsd(n){
  return Number(n || 0).toLocaleString("en-US", { maximumFractionDigits: 0 });
}

function getSlabAdd(rate){
  const base = num(rate);
  const slab = SLABS.find((s, i) => {
    if (i === SLABS.length - 1) return base >= s.min;
    return base >= s.min && base < s.max;
  });
  return slab ? slab.add : 0;
}

function publishedRate(rawVal){
  const base = num(rawVal);
  if (!base) return "";
  return Math.round(base + getSlabAdd(base));
}

function toDateValue(v){
  if (!v) return null;
  if (v instanceof Date) return isNaN(v) ? null : v;
  if (typeof v?.toDate === "function") {
    const dt = v.toDate();
    return isNaN(dt) ? null : dt;
  }
  if (typeof v === "object" && typeof v.seconds === "number") {
    const dt = new Date(v.seconds * 1000);
    return isNaN(dt) ? null : dt;
  }
  const dt = new Date(v);
  return isNaN(dt) ? null : dt;
}

function fmtDate(v){
  const dt = toDateValue(v);
  if (!dt) return v ? String(v).toUpperCase() : "";
  return dt.toLocaleDateString("en-GB", {
    weekday:"short",
    day:"2-digit",
    month:"short",
    year:"numeric"
  }).toUpperCase();
}

function isoDate(v){
  const dt = toDateValue(v);
  return dt ? dt.toISOString().slice(0,10) : "";
}

function expired(r){
  const d = isoDate(r.validity);
  if (!d) return false;
  const today = new Date();
  today.setHours(0,0,0,0);
  return new Date(d + "T00:00:00") < today;
}

function validityClass(r){
  return expired(r) ? "red" : "green";
}

function displayType(v){
  return v === "V" ? "HANDOVER" : v === "S" ? "SAILING" : (v || "");
}

function routeFrom(r){
  return r.pol || r.por || "";
}

function routeTo(r){
  const pod = r.pod || "";
  return r.fpod ? `${pod} / ${r.fpod}` : pod;
}

function routeLabel(r){
  const from = routeFrom(r);
  const to = routeTo(r);
  return [from, to].filter(Boolean).join(" TO ");
}

function summaryLine(r){
  const bits = [];
  if (r.por && r.pol && r.por !== r.pol) bits.push(`POR ${r.por}`);
  if (r.via) bits.push(`VIA ${r.via}`);
  if (r.tt) bits.push(`TT ${r.tt} DAYS`);
  if (r.ft) bits.push(`F/T ${r.ft} DAYS`);
  if (!bits.length && r.fpod) bits.push(`FPOD ${r.fpod}`);
  return bits.join(" • ");
}

function hasValue(v){
  return !(v === undefined || v === null || v === "");
}

function normalizeText(v){
  return String(v ?? "")
    .toUpperCase()
    .normalize("NFKD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^A-Z0-9]+/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function getSearchTerms(query){
  return normalizeText(query).split(" ").filter(Boolean);
}

function getHighlightTerms(query){
  return String(query ?? "")
    .trim()
    .split(/\s+/)
    .map(t => t.replace(/[^\w-]/g, ""))
    .filter(Boolean)
    .sort((a,b) => b.length - a.length);
}

function buildSearchText(r){
  return normalizeText([
    r.id,
    r.seq,
    r.por,
    r.pol,
    r.pod,
    r.fpod,
    routeLabel(r),
    r.via,
    r.remarks,
    r.type ? displayType(r.type) : "",
    r.validity ? fmtDate(r.validity) : "",
    r.ft ? `${r.ft} DAYS FT` : "",
    r.tt ? `${r.tt} DAYS TT` : "",
    r.dv20 ? `20DV USD ${publishedRate(r.dv20)}` : "",
    r.hc40 ? `40HC USD ${publishedRate(r.hc40)}` : "",
    r.container20Type,
    r.container40Type
  ].filter(Boolean).join(" "));
}

function matchesSearch(r, query){
  const terms = getSearchTerms(query);
  if (!terms.length) return true;

  const haystack = buildSearchText(r);
  const hayWords = haystack.split(" ").filter(Boolean);

  return terms.every(term =>
    haystack.includes(term) || hayWords.some(word => word.includes(term))
  );
}

function highlightText(text, query){
  const raw = String(text ?? "");
  const terms = getHighlightTerms(query);
  if (!raw || !terms.length) return escapeHtml(raw);

  const pattern = terms.map(escapeRegExp).join("|");
  if (!pattern) return escapeHtml(raw);

  const re = new RegExp(pattern, "ig");
  let out = "";
  let lastIndex = 0;
  let match;

  while ((match = re.exec(raw)) !== null) {
    const start = match.index;
    const end = start + match[0].length;
    out += escapeHtml(raw.slice(lastIndex, start));
    out += `<mark class="hl">${escapeHtml(raw.slice(start, end))}</mark>`;
    lastIndex = end;
  }

  out += escapeHtml(raw.slice(lastIndex));
  return out;
}

function updateSearchUI(){
  const hasQuery = !!($("searchInput").value || "").trim();
  $("navToggle").classList.toggle("has-query", hasQuery);
  $("clearSearch").classList.toggle("show", hasQuery);
}

function setNavOpen(open, focusInput = false){
  navOpen = open;
  $("topbar").classList.toggle("expanded", open);
  $("topbar").classList.toggle("search-open", open);
  $("navToggle").setAttribute("aria-expanded", String(open));
  $("navToggle").setAttribute("aria-label", open ? "Close search and filters" : "Open search and filters");
  if (focusInput && open) {
    requestAnimationFrame(() => $("searchInput").focus());
  }
}

function completeIntro(autoFocus = false){
  if (introDone) return;
  introDone = true;
  $("topbar").classList.add("intro-complete");
  setNavOpen(true, autoFocus);
}

function scheduleIntroHide(){
  clearTimeout(introTimer);
  introTimer = setTimeout(() => {
    if (!introDone) completeIntro(false);
  }, 3000);
}

function toggleNav(force){
  if (!introDone) completeIntro(true);
  const next = typeof force === "boolean" ? force : !navOpen;
  setNavOpen(next, next);
}

function filteredRows(){
  const q = ($("searchInput").value || "").trim();
  let rows = [...data];

  if (currentView === "active") rows = rows.filter(r => !expired(r));
  if (currentView === "expired") rows = rows.filter(r => expired(r));

  if (q) {
    rows = rows.filter(r => matchesSearch(r, q));
  }

  return rows.sort((a,b) => {
    const db = toDateValue(b.updatedAt || b.createdAt)?.getTime() || 0;
    const da = toDateValue(a.updatedAt || a.createdAt)?.getTime() || 0;
    return db - da;
  });
}

function updateStats(){
  const total = data.length;
  const expiredCount = data.filter(expired).length;
  const activeCount = total - expiredCount;
  const visible = filteredRows().length;

  $("statTotal").textContent = total;
  $("statActive").textContent = activeCount;
  $("statExpired").textContent = expiredCount;
  $("statVisible").textContent = visible;
}

function rateBox(label, rawVal, containerType){
  const val = publishedRate(rawVal);
  const q = $("searchInput").value || "";
  const amountText = val ? `USD ${formatUsd(val)}` : "-";
  return `
    <div class="rate-box">
      <div class="rk">${escapeHtml(label)}</div>
      <div class="rv tabular">${highlightText(amountText, q)}</div>
      <div class="rt">${highlightText(containerType || "STANDARD", q)}</div>
    </div>
  `;
}

function miniMeta(k,v){
  if (!hasValue(v)) return "";
  const q = $("searchInput").value || "";
  return `
    <div class="mini-meta">
      <div class="mk">${escapeHtml(k)}</div>
      <div class="mv">${highlightText(v, q)}</div>
    </div>
  `;
}

function metaItem(k,v){
  if (!hasValue(v)) return "";
  const q = $("searchInput").value || "";
  return `
    <div class="meta-item">
      <div class="mk">${escapeHtml(k)}</div>
      <div class="mv">${highlightText(v, q)}</div>
    </div>
  `;
}

function buildCopyText(r){
  const lines = [];

  if (r.por) lines.push(`POR: ${r.por}`);
  if (r.pol) lines.push(`POL: ${r.pol}`);
  if (r.pod) lines.push(`POD: ${r.pod}`);
  if (r.fpod) lines.push(`FPOD: ${r.fpod}`);

  const from = routeFrom(r);
  const to = r.pod || "";
  const final20 = publishedRate(r.dv20);
  const final40 = publishedRate(r.hc40);

  const type20 = r.container20Type ? ` (${r.container20Type})` : "";
  const type40 = r.container40Type ? ` (${r.container40Type})` : "";

  const part20 = final20 ? `USD ${formatUsd(final20)}/20DV${type20}` : "";
  const part40 = final40 ? `USD ${formatUsd(final40)}/40HC${type40}` : "";

  if (from && to && (part20 || part40)) {
    lines.push(`OF FM ${from} TO ${to} ${[part20, part40].filter(Boolean).join(", ")}`);
  }

  if (r.ft) lines.push(`FT: ${r.ft} DAYS`);
  if (r.tt) lines.push(`TT: ${r.tt} DAYS`);
  if (r.via) lines.push(`ROUTING: ${r.via}`);
  if (r.type) lines.push(`TYPE: ${displayType(r.type)}`);
  if (r.validity) lines.push(`VALIDITY: ${fmtDate(r.validity)}`);
  if (r.remarks) lines.push(`REMARKS: ${r.remarks}`);

  return lines.join("\n");
}

async function copyText(text){
  try{
    await navigator.clipboard.writeText(text);
  }catch{
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
  }
}

function showCopyToast(msg="RATE COPIED"){
  const t = document.createElement("div");
  t.className = "copy-toast";
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 1800);
}

async function doCopy(id){
  const r = data.find(x => x.id === id);
  if (!r) return;
  await copyText(buildCopyText(r));
  showCopyToast("RATE COPIED");
}

function openModal(id){
  const r = data.find(x => x.id === id);
  if (!r) return;

  const q = $("searchInput").value || "";
  currentModalRate = r;

  $("modalTitle").innerHTML = highlightText(routeLabel(r) || "RATE DETAIL", q);
  $("modalSub").innerHTML = highlightText(`${displayType(r.type) || "RATE"} · FULL DETAILS`, q);

  $("modalRates").innerHTML = `
    ${rateBox("20DV", r.dv20, r.container20Type || "STANDARD")}
    ${rateBox("40HC", r.hc40, r.container40Type || "STANDARD")}
  `;

  $("modalMeta").innerHTML = [
    metaItem("POR", r.por),
    metaItem("POL", r.pol),
    metaItem("POD", r.pod),
    metaItem("FPOD", r.fpod),
    metaItem("F/T", r.ft ? `${r.ft} DAYS` : ""),
    metaItem("TT", r.tt ? `${r.tt} DAYS` : ""),
    metaItem("VALIDITY", fmtDate(r.validity)),
    metaItem("TYPE", displayType(r.type)),
    metaItem("ROUTING", r.via),
    metaItem("SEQ", r.seq)
  ].join("");

  $("modalRemarks").innerHTML = `
    <div class="rk">REMARKS</div>
    <div>${highlightText(r.remarks || "NIL", q)}</div>
  `;

  $("modalTerms").innerHTML = `
    <div class="rk">TERMS & CONDITIONS</div>
    <div>${escapeHtml(TERMS_TEXT).replace(/\n/g, "<br>")}</div>
  `;

  $("rateModal").classList.remove("hidden");
  $("rateModal").setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
}

function closeModal(){
  $("rateModal").classList.add("hidden");
  $("rateModal").setAttribute("aria-hidden", "true");
  currentModalRate = null;
  document.body.style.overflow = "";
}

function render(){
  const rows = filteredRows();
  const q = $("searchInput").value || "";

  $("sectionTitle").textContent =
    currentView === "active" ? "ACTIVE RATES" :
    currentView === "expired" ? "EXPIRED RATES" : "ALL RATES";

  updateStats();
  updateSearchUI();

  if (!rows.length) {
    $("ratesGrid").innerHTML = `
      <div class="empty">
        <div style="font-size:calc(28px * var(--font-scale));margin-bottom:10px;"><i class="bi bi-inbox"></i></div>
        <div style="font-size:calc(14px * var(--font-scale));font-weight:900;margin-bottom:6px;color:var(--text);">NO RATES FOUND</div>
        <div>Try changing the search or tab filters.</div>
      </div>
    `;
    return;
  }

  $("ratesGrid").innerHTML = rows.map(r => `
    <article class="rate-card" data-id="${escapeHtml(r.id)}">
      <div class="card-head">
        <div style="min-width:0;">
          <div class="route-main">${highlightText(routeLabel(r) || "ROUTE NOT AVAILABLE", q)}</div>
          <div class="route-sub">${highlightText(summaryLine(r) || "Open the details view for full routing information.", q)}</div>
        </div>

        <div class="badges">
          <span class="badge ${expired(r) ? "danger" : "success"}">
            <i class="bi ${expired(r) ? "bi-x-circle" : "bi-check-circle"}"></i>
            ${expired(r) ? "Expired" : "Active"}
          </span>
          ${r.type ? `
            <span class="badge warning">
              <i class="bi bi-signpost-split"></i>
              ${highlightText(displayType(r.type), q)}
            </span>` : ""}
        </div>
      </div>

      <div class="card-body">
        <div class="rate-strip">
          ${rateBox("20DV", r.dv20, r.container20Type || "STANDARD")}
          ${rateBox("40HC", r.hc40, r.container40Type || "STANDARD")}
        </div>

        <div class="quick-meta">
          ${miniMeta("Validity", fmtDate(r.validity) || "-")}
          ${miniMeta("TT", r.tt ? `${r.tt} DAYS` : "-")}
          ${miniMeta("Routing", r.via || (r.fpod ? `FPOD ${r.fpod}` : "-"))}
        </div>

        <div class="desktop-extra">
          ${miniMeta("POR", r.por || "-")}
          ${miniMeta("POL", r.pol || "-")}
          ${miniMeta("POD", r.pod || "-")}
          ${miniMeta("FPOD", r.fpod || "-")}
        </div>

        ${r.remarks ? `
          <div class="remarks-preview">
            <div class="rk">Remarks</div>
            <div class="rv">${highlightText(r.remarks, q)}</div>
          </div>` : ""
        }
      </div>

      <div class="card-foot">
        <div class="foot-left">
          <div class="seq">${highlightText(`SEQ ${r.seq || "-"}`, q)}</div>
          <div class="validity ${validityClass(r)}">${highlightText(fmtDate(r.validity) || "VALIDITY NOT SET", q)}</div>
        </div>

        <div class="action-row">
          <button class="btn ghost desktop-copy" data-action="copy" data-id="${escapeHtml(r.id)}">
            <i class="bi bi-clipboard"></i>
            <span>Copy</span>
          </button>
          <button class="btn primary" data-action="view" data-id="${escapeHtml(r.id)}">
            <i class="bi bi-eye"></i>
            <span>Details</span>
          </button>
        </div>
      </div>
    </article>
  `).join("");
}

$("navToggle").addEventListener("click", () => {
  if (!introDone) {
    completeIntro(true);
    return;
  }
  toggleNav();
});

$("searchInput").addEventListener("focus", () => {
  if (!introDone) completeIntro(false);
  setNavOpen(true);
});

$("clearSearch").addEventListener("click", () => {
  $("searchInput").value = "";
  render();
  $("searchInput").focus();
});

document.addEventListener("click", async (e) => {
  const btn = e.target.closest("[data-action]");
  if (btn) {
    const id = btn.dataset.id;
    const action = btn.dataset.action;
    if (action === "copy") await doCopy(id);
    if (action === "view") openModal(id);
    return;
  }

  const insideTopbar = e.target.closest("#topbar");
  const insideModal = e.target.closest(".modal");
  if (!insideTopbar && !insideModal && navOpen && introDone && !($("searchInput").value || "").trim()) {
    setNavOpen(false);
  }
});

$("copyModalBtn").addEventListener("click", async () => {
  if (!currentModalRate) return;
  await copyText(buildCopyText(currentModalRate));
  showCopyToast("RATE COPIED");
});

$("closeModal").addEventListener("click", closeModal);
$("closeModalBtn2").addEventListener("click", closeModal);

$("rateModal").addEventListener("click", (e) => {
  if (e.target.id === "rateModal") closeModal();
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if (!$("rateModal").classList.contains("hidden")) {
      closeModal();
      return;
    }
    if (navOpen && introDone && !($("searchInput").value || "").trim()) {
      setNavOpen(false);
    }
  }
});

$("searchInput").addEventListener("input", () => {
  if (!introDone) completeIntro(false);
  setNavOpen(true);
  render();
  if (currentModalRate) openModal(currentModalRate.id);
});

document.querySelectorAll(".tabs button").forEach(btn => {
  btn.addEventListener("click", () => {
    if (!introDone) completeIntro(false);
    document.querySelectorAll(".tabs button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentView = btn.dataset.view;
    render();
  });
});

showLoader();
scheduleIntroHide();

onSnapshot(
  collection(db, "rates"),
  (snap) => {
    data = [];
    snap.forEach((d) => data.push({ id:d.id, ...d.data() }));
    hideLoader();
    render();
  },
  (err) => {
    console.error(err);
    hideLoader();
    $("ratesGrid").innerHTML = `
      <div class="empty">
        <div style="font-size:calc(28px * var(--font-scale));margin-bottom:10px;"><i class="bi bi-exclamation-octagon"></i></div>
        <div style="font-size:calc(14px * var(--font-scale));font-weight:900;margin-bottom:6px;color:var(--text);">FAILED TO LOAD DATA</div>
        <div>Check Firebase configuration or permissions.</div>
      </div>
    `;
  }
);
</script>
</body>
</html>
